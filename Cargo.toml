[package]
name = "nvplay"
version = "0.1.0"
edition = "2024"
default-run = "nvplay"
rust-version = "1.88"
description = "A native, extensible Rust media player powered by libmpv"
license = "GPL-3.0-or-later"

[workspace]
members = ["watch-protocol", "watch-server"]
resolver = "3"

[dependencies]
watch-protocol = { path = "watch-protocol" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "process", "io-util"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
webrtc = "0.14"
eframe = { version = "0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"] }
libloading = "0.8"
rfd = "0.15"
url = "2.5"
sha2 = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
ehttp = "0.7.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[build-dependencies]
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder", "NSEvent", "NSCell"] }
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSAppleEventDescriptor", "NSAppleEventManager", "objc2-core-services"] }

[profile.release]
lto = "thin"
strip = true
