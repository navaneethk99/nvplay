<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch together · nvplay</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111;color:#eee}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:18px;margin:0}header span{color:#d9943d;font-size:13px}.stage{position:relative;background:#000;aspect-ratio:16/9;margin-top:24px;display:grid;place-items:center;border-radius:12px;overflow:hidden}video{width:100%;height:100%;object-fit:contain}.overlay{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;background:#0008}.overlay[hidden]{display:none}button{font:inherit;cursor:pointer;background:#d9943d;color:#111;border:0;border-radius:7px;padding:10px 18px}button:disabled,input:disabled{opacity:.4;cursor:default}.controls{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap}#seek{flex:1;min-width:180px;accent-color:#d9943d}#volume{width:95px;accent-color:#d9943d}#time{font-size:13px;font-variant-numeric:tabular-nums}#status{color:#aaa;font-size:14px;min-height:22px}#title{font-size:16px;overflow-wrap:anywhere}label{font-size:13px}footer{font-size:12px;color:#888;margin-top:24px}@media(max-width:600px){main{padding:14px}.stage{margin-top:16px}.controls{gap:10px}#seek{order:3;flex-basis:100%}}
</style>
<script src="/viewer.js" defer></script>
</head>
<body><main>
<header><h1>nvplay</h1><span>WATCH TOGETHER</span></header>
<div class="stage"><video id="video" playsinline></video><div id="overlay" class="overlay"><p id="overlay-text">Join your friend’s watch party</p><button id="join">Join watch party</button></div></div>
<h2 id="title">Watch together</h2>
<div class="controls"><button id="play" disabled>Play</button><span id="time">0:00 / 0:00</span><input id="seek" aria-label="Shared playback position" type="range" min="0" max="1" step="0.1" value="0" disabled><label>Volume <input id="volume" aria-label="Your volume" type="range" min="0" max="1" step="0.01" value="1"></label><button id="fullscreen">Fullscreen</button></div>
<p id="status" role="status" aria-live="polite">Everyone in this party can play, pause, and seek.</p>
<footer>Keep nvplay open on the host’s computer. Your volume only affects you.</footer>
</main></body></html>
