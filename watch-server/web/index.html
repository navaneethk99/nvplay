<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d1d1d"><title>nvplay · Watch together</title><style>
:root{color-scheme:dark;--accent:#d98422;--bar:#1d1d1d;--text:#dedede;--muted:#a0a0a0;font-family:system-ui,-apple-system,sans-serif;background:#161616;color:var(--text)}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}button,input{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer;color:var(--accent);border:1px solid transparent;border-radius:2px;background:transparent}button:hover{background:#353535;border-color:#454545}button:disabled,input:disabled{opacity:.35;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}svg{width:20px;height:20px;flex:none}.stage{position:relative;width:100%;height:100dvh;min-height:260px;background:#000;overflow:hidden;outline:none}.stage video{position:absolute;inset:44px 0 96px;width:100%;height:calc(100% - 140px);display:block;object-fit:contain}.screen-heading{position:absolute;inset:0 0 auto;height:44px;background:var(--bar);border-bottom:1px solid #333;display:flex;align-items:center;gap:14px;padding:0 12px;transition:opacity .15s}.brand{font-size:15px;font-weight:600;color:var(--text);flex:none}.screen-heading h1{font-size:12px;font-weight:400;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.header-actions{display:flex;align-items:center;gap:4px}.text-button{display:flex;align-items:center;gap:6px;padding:6px 8px;font-size:11px}.text-button svg{width:15px;height:15px}.controls{position:absolute;inset:auto 0 0;background:var(--bar);border-top:1px solid #333;padding:8px 12px 5px;transition:opacity .15s}.timeline-row{display:flex;align-items:center;gap:12px;height:20px}.time{font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums;color:#c5c5c5;min-width:95px}.control-row{display:flex;align-items:center;gap:5px;height:38px}.spacer{flex:1}.icon-button{display:inline-flex;justify-content:center;align-items:center;width:32px;height:30px;flex:none}.play-button{background:#333}.play-button .play-icon{fill:currentColor;stroke:none}.pause-icon{display:none}#play[data-playing=true] .play-icon{display:none}#play[data-playing=true] .pause-icon{display:block}.volume-group{display:flex;align-items:center;gap:4px;margin-left:10px}input[type=range]{appearance:none;-webkit-appearance:none;cursor:pointer;height:4px;background:#505050;border-radius:2px;accent-color:var(--accent);margin:5px 0}input[type=range]::-webkit-slider-thumb{appearance:none;width:10px;height:10px;border-radius:50%;background:var(--accent)}input[type=range]::-moz-range-thumb{width:10px;height:10px;border:0;border-radius:50%;background:var(--accent)}#seek{flex:1;min-width:0;background:linear-gradient(to right,var(--accent) var(--progress,0%),#505050 var(--progress,0%))}#volume{width:80px}.control-note{font-size:10px;color:var(--muted);margin-right:8px}.status-row{height:20px;display:flex;justify-content:space-between;align-items:center;gap:15px;font-size:10px;color:var(--muted)}#status{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0}#quality{white-space:nowrap}.overlay{position:absolute;inset:44px 0 96px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#161616f5;padding:24px;z-index:3}.overlay h2{font-size:18px;font-weight:500;margin:0 0 12px}.overlay p{font-size:12px;line-height:1.6;color:var(--muted);margin:0 0 20px;max-width:360px}.primary{background:var(--accent);color:#171717;font-size:12px;padding:9px 18px;border:0}.primary:hover{background:#e99a3c}.stage:fullscreen,.stage.is-expanded{height:100dvh;min-height:0;width:100vw}.stage.is-expanded{position:fixed;inset:0;z-index:100}body.expanded{overflow:hidden}.stage:fullscreen video,.stage.is-expanded video{inset:0;width:100%;height:100%}.stage:fullscreen .screen-heading,.stage.is-expanded .screen-heading{background:#1d1d1de8}.stage:fullscreen .controls,.stage.is-expanded .controls{background:#1d1d1df2}.stage.controls-hidden .controls,.stage.controls-hidden .screen-heading{opacity:0;pointer-events:none}.stage.controls-hidden{cursor:none}.toast{position:absolute;left:50%;bottom:115px;transform:translateX(-50%);padding:8px 12px;background:#292929;border:1px solid #454545;border-radius:2px;font-size:12px;z-index:6;max-width:90%;text-align:center;pointer-events:none}dialog{max-width:350px;width:calc(100% - 32px);background:var(--bar);color:var(--text);border:1px solid #454545;border-radius:3px;padding:20px;font-size:12px}dialog::backdrop{background:#0009}dialog header{display:flex;align-items:center;justify-content:space-between}dialog h3{font-size:15px;font-weight:500;margin:0}dialog dl{display:grid;grid-template-columns:1fr auto;gap:14px}dialog dd{margin:0;color:var(--accent)}kbd{font:inherit;border:1px solid #454545;padding:2px 5px;border-radius:2px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:600px){.screen-heading{gap:10px;padding:0 8px}.header-actions span{display:none}.text-button{padding:6px}.controls{padding-left:8px;padding-right:8px}.volume-group{margin-left:3px}#volume{width:55px}.control-note{display:none}.time{min-width:85px;font-size:10px}.icon-button{width:30px}.control-row{gap:3px}.screen-heading h1{font-size:11px}}@media(max-width:340px){#volume{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(pointer:coarse){.icon-button{width:40px;height:44px}.control-row{height:48px}.stage video{inset:44px 0 110px;height:calc(100% - 154px)}.overlay{bottom:110px}#seek{height:22px;background-size:100% 4px;background-repeat:no-repeat;background-position:center}input[type=range]::-webkit-slider-thumb{width:16px;height:16px}.stage:fullscreen video,.stage.is-expanded video{inset:0;height:100%}.screen-heading,.controls{padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}.controls{padding-bottom:max(5px,env(safe-area-inset-bottom))}.screen-heading{top:env(safe-area-inset-top)}.volume-group{margin-left:0}#volume{display:none}.control-row{gap:0}}
</style><script src="/viewer.js" defer></script></head>
<body><main><section class="stage" id="player" tabindex="0" aria-label="Shared video player">
<video id="video" playsinline></video>
<header class="screen-heading"><span class="brand">nvplay</span><h1 id="title">Watch together</h1><div class="header-actions"><button id="copy-link" class="text-button" aria-label="Copy invite"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/></svg><span>Copy invite</span></button><button id="leave" class="text-button" aria-label="Leave party"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg><span>Leave party</span></button><button id="exit-expanded" class="icon-button" title="Exit fullscreen (Esc)" aria-label="Exit fullscreen (Esc)" hidden><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div><span id="screen-status" class="sr-only"></span></header>
<div id="overlay" class="overlay"><h2 id="overlay-text">Watch together</h2><p id="overlay-description">Join to watch your friend’s video.</p><button id="join" class="primary">Join watch party</button><button id="rejoin" class="primary" hidden>Rejoin party</button></div>
<div class="controls" id="controls" aria-describedby="rights"><div class="timeline-row"><input id="seek" aria-label="Shared playback position" type="range" min="0" max="1" step="0.1" value="0" disabled><span class="time" id="time">0:00 / 0:00</span></div><div class="control-row"><button id="play" class="icon-button play-button" aria-label="Play (Space)" title="Play / pause (Space)" disabled><svg class="play-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 11 7-11 7z"/></svg><svg class="pause-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button><button id="back" class="icon-button" title="Back 10 seconds (←)" aria-label="Back 10 seconds (←)" disabled><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10a8 8 0 1 1 0 5M4 4v6h6"/><text x="9" y="16" font-size="8" stroke="none" fill="currentColor">10</text></svg></button><button id="forward" class="icon-button" title="Forward 10 seconds (→)" aria-label="Forward 10 seconds (→)" disabled><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10a8 8 0 1 0 0 5M20 4v6h-6"/><text x="9" y="16" font-size="8" stroke="none" fill="currentColor">10</text></svg></button><div class="volume-group"><button id="mute" class="icon-button" title="Mute (M)" aria-label="Mute (M)" ><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 5-6 4H2v6h3l6 4zM15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/></svg></button><input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Your volume"></div><span class="spacer"></span><span class="control-note" id="control-note">Waiting to join</span><button id="shortcuts" class="icon-button" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts (?)" ><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 8a2.5 2.5 0 1 1 4 2c-1.5.5-1.5 1.5-1.5 3m0 3v.1"/></svg></button><button id="fullscreen" class="icon-button" title="Enter fullscreen (F)" aria-label="Enter fullscreen (F)" ><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div><div class="status-row"><p id="status" role="status" aria-live="polite">Ready to join</p><span id="quality"></span></div><p id="rights" class="sr-only"></p></div>
<div class="toast" id="toast" role="status" hidden></div>
<dialog id="shortcut-dialog"><header><h3>Keyboard shortcuts</h3><button id="close-shortcuts" class="icon-button" title="Close keyboard shortcuts" aria-label="Close keyboard shortcuts" ><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></header><dl><dt>Play / pause</dt><dd><kbd>Space</kbd> / <kbd>K</kbd></dd><dt>Seek 10 seconds</dt><dd><kbd>←</kbd> / <kbd>→</kbd></dd><dt>Mute</dt><dd><kbd>M</kbd></dd><dt>Fullscreen</dt><dd><kbd>F</kbd></dd><dt>Exit fullscreen</dt><dd><kbd>Esc</kbd></dd></dl></dialog>
</section></main></body></html>
